spring:
  datasource:
    url: jdbc:mysql://localhost:3306/management?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123}
    driver-class-name: com.mysql.cj.jdbc.Driver

# JWT 配置
jwt:
  secret: ${JWT_SECRET:management-secret-key-for-jwt-token-generation-2024}
  expiration: ${JWT_EXPIRATION:86400000}  # 24小时
